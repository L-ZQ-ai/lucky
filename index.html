<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幸运抽奖转盘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23E8B54A'/%3E%3Cpath d='M12 4l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4L7.5 17.8l.9-5-3.6-3.5 5-.7z' fill='%233A0B06'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#26060A; --bg-deep:#160203;
  --panel:#3D0B10;
  --line:rgba(232,181,74,.26);
  --gold:#E8B54A; --gold-strong:#F2C86E; --gold-deep:#A9761F;
  --cream:#F6E9D2; --dim:#C9A47C;
  --red:#DF4238; --red-deep:#98231C;
  --ok:#67C98A;
  --font-display:'ZCOOL KuaiLe','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;
  background:
    radial-gradient(1100px 700px at 50% -8%, rgba(232,181,74,.16), transparent 62%),
    radial-gradient(900px 560px at 82% 108%, rgba(223,66,56,.20), transparent 60%),
    linear-gradient(180deg, var(--bg), var(--bg-deep));
  color:var(--cream); font-family:var(--font-body); font-size:16px; line-height:1.6;
}
.page{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--gold-strong);outline-offset:2px}
header{text-align:center;padding:12px 0 10px}
h1{font-family:var(--font-display);font-size:36px;font-weight:400;letter-spacing:2px;color:var(--gold-strong);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.sub{color:var(--dim);font-size:14px;margin-top:4px}

/* ===== 转盘 ===== */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.wheel-box{position:relative;width:min(84vw,380px);aspect-ratio:1;margin-top:8px}
#wheel{display:block;width:100%;height:100%;border-radius:50%;filter:drop-shadow(0 10px 26px rgba(0,0,0,.55))}
.pointer{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:44px;height:44px;z-index:2;pointer-events:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))}
.hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:86px;height:86px;border-radius:50%;z-index:2;
  font-family:var(--font-display);font-size:24px;letter-spacing:2px;color:#2A0A04;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%, var(--gold-strong), var(--gold-deep) 70%);
  box-shadow:0 0 0 5px rgba(20,4,2,.55), 0 4px 14px rgba(0,0,0,.5);
}
.ring{position:absolute;inset:6px;border-radius:50%;border:2px dashed rgba(58,11,6,.5)}
.hub:active{transform:translate(-50%,-50%) scale(.95)}
.hub:disabled{filter:grayscale(.5)}

/* ===== 图例 ===== */
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:4px auto;width:100%;max-width:380px}
.legend-item{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;min-height:40px;flex:1 1 42%}
.legend-item .dot{width:11px;height:11px;border-radius:50%;flex:none}
.legend-item .lp{color:var(--gold-strong);font-size:13px}

/* ===== 右侧面板 ===== */
.side{max-width:560px;margin:18px auto 0;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:15px;color:var(--gold-strong)}
.panel-head b{font-weight:700}
.panel-head .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.mini-btn{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:3px 10px;min-height:28px}
.mini-btn:hover{color:var(--gold-strong);border-color:var(--gold)}
#sumHint{font-size:12px;font-weight:400}
#sumHint.ok{color:var(--ok)}
#sumHint.bad{color:var(--red)}

/* 记录 */
.recs{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.rec{display:flex;align-items:center;gap:10px;background:rgba(20,4,7,.5);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.rec .r-idx{color:var(--dim);font-size:12px;width:26px;flex:none}
.rec .dot{width:10px;height:10px;border-radius:50%;flex:none}
.rec .r-name{font-weight:700}
.rec .r-time{margin-left:auto;color:var(--dim);font-size:12px}
.empty-tip{color:var(--dim);font-size:13px;text-align:center;padding:10px 0}

/* 概率编辑 */
.pe-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pe-row .dot{width:12px;height:12px;border-radius:50%;flex:none}
.pe-row .pe-name{font-size:14px;width:62px;flex:none}
.pe-row input{width:64px;flex:none;background:#200407;border:1px solid var(--line);border-radius:9px;color:var(--cream);padding:7px 8px;text-align:center}
.pe-row .pe-pct{color:var(--dim);font-size:13px}
.apply-btn{width:100%;min-height:46px;border-radius:12px;font-size:16px;font-weight:700;background:linear-gradient(180deg,var(--gold-strong),var(--gold-deep));color:#2A0A04;margin-top:4px}
.panel-note{font-size:12px;color:var(--dim);margin-top:10px}

/* ===== 结果弹窗 ===== */
.modal[hidden]{display:none}
.panel[hidden]{display:none}
.modal{position:fixed;inset:0;background:rgba(12,2,3,.72);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal-card{
  background:linear-gradient(180deg,var(--panel),var(--bg-deep));border:1px solid var(--gold);
  border-radius:20px;padding:28px 28px 24px;text-align:center;max-width:340px;width:100%;
  box-shadow:0 16px 48px rgba(0,0,0,.6);
}
.modal-card .m-label{color:var(--dim);font-size:14px}
.modal-card .m-prize{font-family:var(--font-display);font-size:40px;font-weight:400;color:var(--gold-strong);letter-spacing:2px;margin:8px 0 4px}
.modal-card .m-prob{color:var(--dim);font-size:13px;margin-bottom:18px}
.modal-card .again{width:100%;min-height:50px;border-radius:12px;font-size:17px;font-weight:700;background:linear-gradient(180deg,var(--gold-strong),var(--gold-deep));color:#2A0A04}
.modal-card .close{margin-top:10px;font-size:13px;color:var(--dim);width:100%;min-height:40px}

/* Toast / 彩带 */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#2A0A04;font-size:14px;font-weight:700;padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ===== 桌面 ===== */
@media (min-width:900px){
  .page{padding:28px 28px 56px}
  h1{font-size:44px}
  .layout{max-width:640px;margin:0 auto}
  .wheel-box{width:min(420px,48vh)}
  .side{margin:0 auto;max-width:520px}
  .legend-item{flex:1 1 20%;padding:6px 10px}
  .legend{max-width:520px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="mainTitle">幸运抽奖转盘</h1>
    <p class="sub">扇形按概率划分 · 点击即转 · 按概率定格</p>
  </header>

  <div class="layout">
    <section class="stage" aria-label="抽奖转盘">
      <div class="wheel-box">
        <svg class="pointer" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.6L4.6 22h14.8z" fill="#F2C86E" stroke="#3A0B06" stroke-width="1.6"/><path d="M9.2 9.4L12 4.6l2.8 4.8z" fill="#98231C"/></svg>
        <canvas id="wheel" aria-label="抽奖转盘"></canvas>
        <button class="hub" id="spinBtn" aria-label="点击开始抽奖">
          <span class="ring"></span><span id="hubText">开始</span>
        </button>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="side">
      <div class="panel">
        <div class="panel-head"><b>抽奖记录</b><span class="right"><span id="recCount" style="font-size:12px;color:var(--dim)"></span><button class="mini-btn" id="clearRecBtn">清空</button></span></div>
        <div class="recs" id="recs"><div class="empty-tip">暂无记录</div></div>
      </div>

      <div class="panel" id="probPanel" hidden>
        <div class="panel-head"><b>概率设置</b><span class="right"><span id="sumHint"></span><button class="mini-btn" id="hideProbBtn">收起</button></span></div>
        <div id="probEditors"></div>
        <button class="apply-btn" id="applyProbBtn">应用概率</button>
        <p class="panel-note">转盘扇形角度按显示概率划分；中奖结果按实际权重随机抽取，四项概率之和必须为 100%。</p>
      </div>

    </aside>
  </div>
</div>

<div class="modal" id="resultModal" hidden>
  <div class="modal-card">
    <p class="m-label">恭喜中奖</p>
    <p class="m-prize" id="mPrize">特等奖</p>
    <p class="m-prob" id="mProb"></p>
    <button class="again" id="againBtn">再来一次</button>
    <button class="close" id="closeModalBtn">关闭</button>
  </div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" role="status"></div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);

/* Toast */
const toastEl = $('#toast');
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

/* ===== 奖项与概率 ===== */
let tiers = [
  { name:'特等奖', prob:1,  real:0,  color:'#E8B54A', light:true  },
  { name:'一等奖', prob:10, real:10, color:'#C62A26', light:false },
  { name:'二等奖', prob:30, real:30, color:'#F2C86E', light:true  },
  { name:'三等奖', prob:59, real:59, color:'#8F1F1A', light:false }
];
const totalProb = () => tiers.reduce((a, t) => a + t.prob, 0);
const totalReal = () => tiers.reduce((a, t) => a + t.real, 0);
let records = [];
let recSeq = 0;
let angle = 0;
let spinning = false;
let lastIdx = -1;

/* ===== 转盘绘制 ===== */
const canvas = $('#wheel');
const ctx = canvas.getContext('2d');
const wheelBox = document.querySelector('.wheel-box');
let W = 0, R = 0;
function sizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const d = wheelBox.clientWidth;
  if (d < 8){ requestAnimationFrame(sizeCanvas); return; }
  W = d;
  canvas.width = Math.round(d * dpr);
  canvas.height = Math.round(d * dpr);
  canvas.style.width = d + 'px';
  canvas.style.height = d + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  R = W / 2 - 4;
  drawWheel();
}
function drawWheel(){
  ctx.clearRect(0, 0, W, W);
  const cx = W / 2, cy = W / 2;
  if (R < 4){ return; }
  const total = totalProb();
  if (total <= 0){
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI);
    ctx.fillStyle = '#3D0B10'; ctx.fill();
    ctx.strokeStyle = 'rgba(232,181,74,.5)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#C9A47C'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = "700 16px 'Noto Sans SC',sans-serif";
    ctx.fillText('请先设置概率', cx, cy);
    return;
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  let acc = -Math.PI / 2;
  for (const t of tiers){
    const arc = t.prob / total * 2 * Math.PI;
    const a0 = acc, a1 = acc + arc;
    acc = a1;
    if (arc > 0){
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, a0, a1);
      ctx.closePath();
      ctx.fillStyle = t.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(246,233,210,.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // 标签
      const mid = a0 + arc / 2;
      const rTxt = R * 0.62;
      const fit = (arc * rTxt) / 4;
      if (fit < 10) continue; // 扇形过窄不画文字，信息见图例
      const fs = Math.min(16, fit);
      ctx.save();
      ctx.rotate(mid);
      ctx.translate(rTxt, 0);
      if (Math.sin(mid) < -0.05) ctx.rotate(Math.PI);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = t.light ? '#3A0B06' : '#F6E9D2';
      ctx.font = '700 ' + fs + 'px "Noto Sans SC",sans-serif';
      ctx.fillText(t.name, 0, -fs * 0.62);
      ctx.font = '500 ' + (fs - 2) + 'px "Noto Sans SC",sans-serif';
      ctx.fillText(t.prob + '%', 0, fs * 0.72);
      ctx.restore();
    }
  }
  ctx.restore();
}

/* 指针当前落在的奖项序号 */
function idxAtPointer(){
  const total = totalProb();
  if (total <= 0) return -1;
  let x = (-angle) % (2 * Math.PI);
  if (x < 0) x += 2 * Math.PI;
  let s = 0;
  for (let i = 0; i < tiers.length; i++){
    const arc = tiers[i].prob / total * 2 * Math.PI;
    if (x < s + arc) return i;
    s += arc;
  }
  return tiers.length - 1;
}

/* ===== 旋转 ===== */
const spinBtn = $('#spinBtn');
const hubText = $('#hubText');
function easeInOutCubic(p){ return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }

function spin(){
  if (spinning) return;
  const total = totalProb();
  if (total <= 0){ toast('请先设置概率'); return; }
  spinning = true;
  spinBtn.disabled = true;
  hubText.textContent = '…';
  ensureAudio();
  // 按实际权重加权随机选中奖项（特等奖实际权重为0，不会被选中）
  const realTotal = totalReal();
  let r = Math.random() * realTotal;
  let win = 0;
  for (let i = 0; i < tiers.length; i++){
    r -= tiers[i].real;
    if (r <= 0){ win = i; break; }
  }
  const arcWin = tiers[win].prob / total * 2 * Math.PI;
  let startRel = 0;
  for (let i = 0; i < win; i++) startRel += tiers[i].prob / total * 2 * Math.PI;
  const xStar = startRel + arcWin * (0.5 + (Math.random() - 0.5) * 0.6);
  let target = -xStar;
  const minTurns = 5.2 + Math.random() * 1.4;
  while (target < angle + 2 * Math.PI * minTurns) target += 2 * Math.PI;
  const startA = angle;
  const dist = target - startA;
  const dur = 4600 + Math.random() * 1200;
  const t0 = performance.now();
  lastIdx = idxAtPointer();
  (function step(now){
    const p = Math.min(1, (now - t0) / dur);
    angle = startA + dist * easeInOutCubic(p);
    drawWheel();
    const idx = idxAtPointer();
    if (idx !== lastIdx){ lastIdx = idx; tick(); }
    if (p < 1) requestAnimationFrame(step);
    else { angle = target; drawWheel(); finish(win); }
  })(t0);
}

function finish(win){
  // 兜底校准：若指针未落在中奖扇区，平滑对齐到该扇区中心
  if (idxAtPointer() !== win){
    const total = totalProb();
    let off = 0;
    for (let i = 0; i < win; i++) off += tiers[i].prob / total * 2 * Math.PI;
    const aLocal = -Math.PI / 2 + off + tiers[win].prob / total * Math.PI;
    let want = -Math.PI / 2 - aLocal;
    while (want < angle) want += 2 * Math.PI;
    angle = want;
    drawWheel();
  }
  spinning = false;
  spinBtn.disabled = false;
  hubText.textContent = '再转';
  const t = tiers[win];
  recSeq++;
  const d = new Date();
  const z = (n) => String(n).padStart(2, '0');
  const time = z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
  records.push({ seq: recSeq, name: t.name, color: t.color, time });
  if (records.length > 60) records.shift();
  $('#mPrize').textContent = t.name;
  $('#mProb').textContent = '中奖概率 ' + t.prob + '%';
  $('#resultModal').hidden = false;
  chime();
  confetti();
  renderRecords();
}

/* ===== 图例 ===== */
function renderLegend(){
  const legend = $('#legend');
  legend.innerHTML = tiers.map(t =>
    '<span class="legend-item"><span class="dot" style="background:' + t.color + '"></span>' + t.name + ' <span class="lp">' + t.prob + '%</span></span>'
  ).join('');
}

/* ===== 记录渲染 ===== */
function renderRecords(){
  const box = $('#recs');
  if (!records.length){ box.innerHTML = '<div class="empty-tip">暂无记录</div>'; $('#recCount').textContent = ''; return; }
  const list = [...records].reverse();
  box.innerHTML = list.map(r =>
    '<div class="rec"><span class="r-idx">' + r.seq + '</span><span class="dot" style="background:' + r.color + '"></span><span class="r-name">' + r.name + '</span><span class="r-time">' + r.time + '</span></div>'
  ).join('');
  $('#recCount').textContent = '共 ' + records.length + ' 次';
}
$('#clearRecBtn').addEventListener('click', () => {
  records = [];
  renderRecords();
  toast('记录已清空');
});

/* ===== 概率编辑 ===== */
const probEditors = $('#probEditors');
const sumHint = $('#sumHint');
function renderProbEditors(){
  probEditors.innerHTML = tiers.map((t, i) =>
    '<div class="pe-row"><span class="dot" style="background:' + t.color + '"></span><span class="pe-name">' + t.name + '</span>' +
    '<input type="number" min="0" max="100" step="1" value="' + t.prob + '" data-i="' + i + '"><span class="pe-pct">%</span></div>'
  ).join('');
  probEditors.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateSumHint));
  updateSumHint();
}
function updateSumHint(){
  const sum = [...probEditors.querySelectorAll('input')].reduce((a, inp) => a + (parseInt(inp.value, 10) || 0), 0);
  sumHint.textContent = '合计 ' + sum + '%';
  sumHint.className = sum === 100 ? 'ok' : 'bad';
}
$('#applyProbBtn').addEventListener('click', () => {
  const vals = [...probEditors.querySelectorAll('input')].map(inp => Math.max(0, Math.min(100, parseInt(inp.value, 10) || 0)));
  const sum = vals.reduce((a, v) => a + v, 0);
  if (sum !== 100){ toast('概率之和必须为 100%，当前 ' + sum + '%'); return; }
  tiers.forEach((t, i) => {
    t.prob = vals[i];
    if (i !== 0) t.real = vals[i];
  });
  renderLegend();
  drawWheel();
  updateSumHint();
  toast('概率已应用');
});

/* ===== 弹窗 ===== */
$('#spinBtn').addEventListener('click', spin);
$('#againBtn').addEventListener('click', () => { $('#resultModal').hidden = true; spin(); });
$('#closeModalBtn').addEventListener('click', () => { $('#resultModal').hidden = true; });

/* ===== 隐藏入口：2 秒内连续点击标题 5 次唤起概率设置 ===== */
let titleClicks = 0;
let titleTimer = null;
$('#mainTitle').addEventListener('click', () => {
  titleClicks++;
  clearTimeout(titleTimer);
  titleTimer = setTimeout(() => { titleClicks = 0; }, 2000);
  if (titleClicks >= 5){
    titleClicks = 0;
    $('#probPanel').hidden = false;
    toast('已进入概率设置');
  }
});
$('#hideProbBtn').addEventListener('click', () => { $('#probPanel').hidden = true; });

/* ===== 音效 ===== */
let actx = null;
function ensureAudio(){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }catch(e){}
}
function blip(freq, dur, type, gainV){
  if (!actx) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(gainV, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
function tick(){ blip(900, 0.03, 'square', 0.04); }
function chime(){
  blip(660, 0.14, 'sine', 0.14);
  setTimeout(() => blip(880, 0.2, 'sine', 0.14), 120);
}

/* ===== 彩带 ===== */
const confCanvas = $('#confetti');
const cctx = confCanvas.getContext('2d');
let parts = [], confRaf = null;
function sizeConfetti(){
  const dpr = window.devicePixelRatio || 1;
  confCanvas.width = Math.round(innerWidth * dpr);
  confCanvas.height = Math.round(innerHeight * dpr);
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const CONF_COLORS = ['#E8B54A','#F2C86E','#DF4238','#F6E9D2','#67C98A'];
function confetti(){
  for (let i = 0; i < 64; i++){
    parts.push({
      x: innerWidth * (0.2 + Math.random() * 0.6), y: -10 - Math.random() * 120,
      vx: (Math.random() - 0.5) * 3.2, vy: 2.2 + Math.random() * 3.6, g: 0.06,
      s: 5 + Math.random() * 6, c: CONF_COLORS[i % CONF_COLORS.length],
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3
    });
  }
  if (!confRaf) confRaf = requestAnimationFrame(confStep);
}
function confStep(){
  cctx.clearRect(0, 0, innerWidth, innerHeight);
  parts.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.r);
    cctx.fillStyle = p.c;
    cctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
    cctx.restore();
  });
  parts = parts.filter(p => p.y < innerHeight + 20);
  if (parts.length){ confRaf = requestAnimationFrame(confStep); }
  else { confRaf = null; cctx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ===== 初始化 ===== */
window.addEventListener('resize', () => { sizeCanvas(); sizeConfetti(); });
renderLegend();
renderProbEditors();
renderRecords();
sizeCanvas();
sizeConfetti();

</script>
